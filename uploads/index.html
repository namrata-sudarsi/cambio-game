<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambio Card Game</title>
    <meta name="description" content="Play Cambio - the fast-paced memory card game. Try to get the lowest score!" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #080b12; }
      #root { height: 100%; }

      @keyframes cardReveal {
        0%   { opacity: 0.2; transform: perspective(700px) rotateY(80deg) scale(0.9); }
        100% { opacity: 1;   transform: perspective(700px) rotateY(0deg)  scale(1); }
      }
      @keyframes cardFromDeck {
        0%   { opacity: 0; transform: translateY(-80px) rotate(-4deg) scale(0.7); }
        65%  { transform: translateY(5px) rotate(0.5deg) scale(1.03); }
        100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
      }
      @keyframes cardToDiscard {
        0%   { opacity: 1; transform: translateY(0) translateX(0) rotate(0deg) scale(1); }
        100% { opacity: 0; transform: translateY(72px) translateX(50px) rotate(12deg) scale(0.6); }
      }
      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes dealIn {
        0%   { opacity: 0; transform: translateY(-60px) scale(0.6) rotate(-6deg); }
        100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      }
      @keyframes pulseBorder {
        0%, 100% { box-shadow: 0 0 0 0 rgba(212,175,55,0.5); }
        50%       { box-shadow: 0 0 0 5px rgba(212,175,55,0); }
      }
      @keyframes winnerPop {
        0%   { transform: scale(0.6); opacity: 0; }
        70%  { transform: scale(1.08); }
        100% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
